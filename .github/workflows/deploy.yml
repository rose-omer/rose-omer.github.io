# Siteyi derler ve GitHub Pages'e yayınlar (Settings → Pages → Source: GitHub Actions).
# GEMINI_API_KEY verilmez: sohbet düğmesi canlıda görünmez, anahtar koda gömülmez.
name: Yayınla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Tip denetimi
        run: npm run lint
      - name: Derle
        run: npm run build
      - name: Pages paketi yükle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5
