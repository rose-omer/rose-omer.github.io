# Siteyi derler ve GitHub Pages'e yayınlar.
# Ön koşul: Settings → Pages → Source: "GitHub Actions" (elle bir kez yapılır).
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
      - name: Derle ve Pages paketi yükle
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5
